name: Release windows portable

# Push a tag to publish. The version baked into the build is read from
# src-tauri/tauri.conf.json, so bump package.json, Cargo.toml and
# tauri.conf.json together and make the tag match:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The tag must be newer than what users are running, or no client will offer it.
#
# Requires the repository secret TAURI_SIGNING_PRIVATE_KEY: the private half of
# the key whose public half is plugins.updater.pubkey in tauri.conf.json. Losing
# it means never being able to update an already-installed copy again.

on:
  push:
    tags: ["v*"]
  # The manual route exists for two reasons: the diagnose job answers "why can
  # CI not publish?" without waiting out a build, and `publish: true` builds and
  # releases whatever main currently holds.
  #
  #   gh workflow run release.yml --ref main -f publish=true
  #
  # A manual publish takes its version from tauri.conf.json exactly as a tag push
  # does, so it creates the same release either way.
  workflow_dispatch:
    inputs:
      publish:
        description: "Build and publish this commit, rather than only diagnosing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # `gh workflow run release.yml` with no inputs runs just this. It changes
  # nothing unless the thing it is testing starts working, and then only leaves
  # a draft release named to be obviously disposable.
  diagnose:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    runs-on: windows-latest
    steps:
      # Without a checkout `gh release create` gives up before it makes the call
      # ("failed to run git"), which is the call this job exists to watch.
      - uses: actions/checkout@v4

      - name: What this token can do
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Output "=== gh ==="
          gh --version
          Write-Output "=== which credential gh picked up ==="
          gh auth status 2>&1
          Write-Output "=== what the repository says this token may do ==="
          gh api "repos/$env:GITHUB_REPOSITORY" --jq '{visibility, fork, archived, permissions}'
          Write-Output "=== can it read releases? (a number means yes) ==="
          gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=1" --jq 'length'
          Write-Output "=== the call that fails, with the whole conversation shown ==="
          $env:GH_DEBUG = "api"
          gh release create "v0.0.0-diagnostic" --draft --target "$env:GITHUB_SHA" --title "diagnostic - safe to delete" --notes "probe" 2>&1 | Select-Object -Last 120
          Write-Output "=== end: a 403 above is the bug; 'Created draft release' means it worked ==="
          exit 0

  portable:
    # A tag publishes on its own; a manual run only when it was asked to.
    if: github.event_name == 'push' || inputs.publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: dtolnay/rust-toolchain@stable

      # A cold release build of a Tauri app is slow; this makes a rebuild after
      # a small change a few minutes instead.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      # No bundle: the portable build *is* the bare executable.
      - run: pnpm tauri build --no-bundle --ci

      - name: Package, sign and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}\sheetlens.key
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY is not set."
          }
          Set-Content -Path $env:TAURI_SIGNING_PRIVATE_KEY_PATH -Value $env:SIGNING_KEY -NoNewline

          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $arch = "x64"
          $zipName = "SheetLens_${version}_${arch}-portable.zip"

          # The changelog section for this version. All three languages must have
          # one — a release with nothing to say about itself is worse than no
          # release, and a translation that quietly lags is worse than none.
          function Get-VersionNotes([string]$ChangelogPath, [string]$Target) {
            $match = [regex]::Match(
              # Explicitly UTF-8: an inherited ANSI codepage silently mangles the
              # CJK sections into mojibake rather than failing.
              (Get-Content $ChangelogPath -Raw -Encoding utf8),
              "(?sm)^##\s+\[?$([regex]::Escape($Target))\]?[^\n]*\r?\n(.*?)(?=^##\s|\z)"
            )
            if (-not $match.Success) { throw "$ChangelogPath has no '## [$Target]' section. Add one for this release." }
            $text = $match.Groups[1].Value.Trim()
            if (-not $text) { throw "The $Target section of $ChangelogPath is empty." }
            return $text
          }

          # The release page carries every language, and so does the manifest:
          # the app shows the notes for the locale it is running in, which it
          # reads from `notesLocales`. `notes` stays English on its own, for any
          # other updater client — that is the only field they know about.
          $notes = Get-VersionNotes "CHANGELOG.md" $version
          $notesZhCN = Get-VersionNotes "CHANGELOG.zh-CN.md" $version
          $notesJa = Get-VersionNotes "CHANGELOG.ja.md" $version
          $releaseBody = @(
            "## English", $notes,
            "", "## 简体中文", $notesZhCN,
            "", "## 日本語", $notesJa
          ) -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesFile -Value $releaseBody -Encoding utf8NoBOM

          # `--no-bundle` leaves the raw cargo build, named after the crate; some
          # Tauri versions rename it to the product name instead. Take whichever
          # is there rather than guessing.
          $built = @(
            "src-tauri/target/release/SheetLens.exe"
            "src-tauri/target/release/sheet-lens.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $built) { throw "No built executable in src-tauri/target/release." }

          $stage = "portable/SheetLens_${version}_${arch}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $built (Join-Path $stage "SheetLens.exe") -Force
          Copy-Item "README*.md" $stage -Force
          Copy-Item "CHANGELOG*.md" $stage -Force
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" (Join-Path $stage "LICENSE") -Force }

          # Its presence beside the executable is what lets the app replace
          # itself; a build without it will not offer to update.
          Set-Content -Path (Join-Path $stage "portable.sheetlens") -Value "" -NoNewline

          # Carried inside the signed archive. The app checks it against the
          # version it was told about before it installs anything.
          $manifest = [ordered]@{ schema = 1; version = $version; arch = $arch } | ConvertTo-Json
          Set-Content -Path (Join-Path $stage "update-manifest.json") -Value $manifest -Encoding utf8NoBOM

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zipName -Force

          # The key has no password, so pass an explicit empty one: omitting it
          # makes the signer prompt, which hangs a non-interactive job.
          pnpm tauri signer sign --app-version $version --password= $zipName
          if (!(Test-Path "$zipName.sig")) { throw "Missing signature: $zipName.sig" }

          # The updater reads this for the latest version and derives the archive
          # URL from it, so the file name, the tag and the version must agree.
          $latest = [ordered]@{
            version   = $version
            notes     = $notes
            # Keyed by the app's own locale codes, which is what it asks for.
            notesLocales = [ordered]@{
              en      = $notes
              "zh-CN" = $notesZhCN
              ja      = $notesJa
            }
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$zipName.sig" -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$zipName"
              }
            }
          } | ConvertTo-Json -Depth 4
          Set-Content -Path "latest.json" -Value $latest -Encoding utf8NoBOM

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --title "SheetLens $version" --notes-file $notesFile
          } else {
            # A re-run should land the same notes as a first run, not leave
            # whatever the previous attempt wrote.
            gh release edit $tag --notes-file $notesFile
          }
          gh release upload $tag $zipName "$zipName.sig" "latest.json" --clobber
