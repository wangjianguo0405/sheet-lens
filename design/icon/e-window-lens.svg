<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="e-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7CF6"/>
      <stop offset="1" stop-color="#1C60E8"/>
    </linearGradient>
    <linearGradient id="e-ring" gradientUnits="userSpaceOnUse" x1="500" y1="404" x2="800" y2="712">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1C50D8"/>
    </linearGradient>
    <linearGradient id="e-grip" gradientUnits="userSpaceOnUse" x1="824" y1="732" x2="958" y2="866">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#16337F"/>
    </linearGradient>
    <clipPath id="e-card">
      <rect x="90" y="160" width="680" height="640" rx="56"/>
    </clipPath>
    <clipPath id="e-lens">
      <circle cx="646" cy="554" r="134"/>
    </clipPath>
  </defs>

  <!-- the window -->
  <rect x="90" y="160" width="680" height="640" rx="56" fill="#FFFFFF"/>
  <g clip-path="url(#e-card)">
    <rect x="90" y="160" width="680" height="110" fill="url(#e-bar)"/>
    <circle cx="160" cy="215" r="17" fill="#BFD9FB"/>
    <circle cx="220" cy="215" r="17" fill="#BFD9FB"/>
    <circle cx="280" cy="215" r="17" fill="#BFD9FB"/>

    <!-- header row -->
    <rect x="130" y="295" width="183" height="76" rx="14" fill="#3B82F6"/>
    <rect x="338" y="295" width="183" height="76" rx="14" fill="#3B82F6"/>
    <rect x="546" y="295" width="183" height="76" rx="14" fill="#3B82F6"/>

    <!-- body -->
    <rect x="130" y="395" width="183" height="78" rx="14" fill="#A8D8F5"/>
    <rect x="338" y="395" width="183" height="78" rx="14" fill="#E6EAF8"/>
    <rect x="546" y="395" width="183" height="78" rx="14" fill="#F0F4FB"/>
    <rect x="130" y="495" width="183" height="78" rx="14" fill="#A8D8F5"/>
    <rect x="338" y="495" width="183" height="78" rx="14" fill="#E6EAF8"/>
    <rect x="546" y="495" width="183" height="78" rx="14" fill="#F0F4FB"/>
    <rect x="130" y="595" width="183" height="78" rx="14" fill="#A8D8F5"/>
    <rect x="338" y="595" width="183" height="78" rx="14" fill="#E6EAF8"/>
    <rect x="546" y="595" width="183" height="78" rx="14" fill="#F0F4FB"/>
    <rect x="130" y="695" width="183" height="78" rx="14" fill="#A8D8F5"/>
    <rect x="338" y="695" width="183" height="78" rx="14" fill="#E6EAF8"/>
    <rect x="546" y="695" width="183" height="78" rx="14" fill="#F0F4FB"/>
  </g>

  <!-- the lens -->
  <g clip-path="url(#e-lens)">
    <circle cx="646" cy="554" r="134" fill="#DCEAFB"/>
    <rect x="597" y="420" width="14" height="268" fill="#AECBEA"/>
    <rect x="681" y="420" width="14" height="268" fill="#AECBEA"/>
    <rect x="512" y="505" width="268" height="14" fill="#AECBEA"/>
    <rect x="512" y="589" width="268" height="14" fill="#AECBEA"/>
    <path d="M 566 517 A 88 88 0 0 1 634 467" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  </g>
  <line x1="766" y1="674" x2="824" y2="732" stroke="#16337F" stroke-width="58"/>
  <line x1="824" y1="732" x2="930" y2="838" stroke="url(#e-grip)" stroke-width="80" stroke-linecap="round"/>
  <circle cx="646" cy="554" r="168" fill="none" stroke="url(#e-ring)" stroke-width="68"/>
</svg>
