<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="b-tile">
      <rect x="96" y="96" width="832" height="832" rx="192"/>
    </clipPath>
    <clipPath id="b-lens">
      <circle cx="640" cy="660" r="250"/>
    </clipPath>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="192" fill="#2563EB"/>

  <!-- the sheet's header, kept clear of the lens -->
  <g clip-path="url(#b-tile)">
    <rect x="96" y="96" width="832" height="234" fill="#FFFFFF" opacity="0.16"/>
    <rect x="96" y="330" width="832" height="18" fill="#FFFFFF" opacity="0.5"/>
    <rect x="384" y="96" width="18" height="234" fill="#FFFFFF" opacity="0.4"/>
    <rect x="672" y="96" width="18" height="234" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- the lens -->
  <g clip-path="url(#b-lens)">
    <circle cx="640" cy="660" r="250" fill="#FFFFFF" opacity="0.18"/>
    <rect x="470" y="516" width="340" height="64" rx="32" fill="#FFFFFF"/>
    <rect x="470" y="628" width="340" height="64" rx="32" fill="#FFFFFF"/>
    <rect x="470" y="740" width="340" height="64" rx="32" fill="#FFFFFF"/>
  </g>
  <line x1="817" y1="837" x2="900" y2="920" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
  <circle cx="640" cy="660" r="250" fill="none" stroke="#FFFFFF" stroke-width="40"/>
</svg>
